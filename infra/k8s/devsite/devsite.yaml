# dylankappler.com (github.com/wardbox/devsite): a static Astro site in a Caddy
# image, the same shape as the blog. That repo's build.yml commits the image
# digest here on every main build; Argo CD rolls it out.
apiVersion: v1
kind: Namespace
metadata:
  name: devsite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsite
  namespace: devsite
  labels:
    app: devsite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsite
  template:
    metadata:
      labels:
        app: devsite
    spec:
      automountServiceAccountToken: false
      # Image is private on GHCR; the pull secret is copied from the loltrack namespace:
      # kubectl -n loltrack get secret ghcr-pull -o yaml | sed 's/namespace: loltrack/namespace: devsite/' | kubectl apply -f -
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: devsite
          image: ghcr.io/wardbox/devsite:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: devsite
  namespace: devsite
spec:
  selector:
    app: devsite
  ports:
    - name: http
      port: 80
      targetPort: http
---
# dylankappler.com is at Gandi, so HTTP-01 through Traefik, as numbered.gg does.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsite
  namespace: devsite
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dylankappler.com
        - www.dylankappler.com
      secretName: dylankappler-com-tls
  rules:
    - host: dylankappler.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsite
                port:
                  number: 80
    - host: www.dylankappler.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsite
                port:
                  number: 80
