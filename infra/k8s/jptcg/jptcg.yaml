# jptcg — Pokémon TCG spread scanner (github.com/wardbox/jptcg).
# Image is built and pushed by that repo's Actions; this manifest owns deploy.
# Scan runs in-process every 6h inside the server — no CronJob.
apiVersion: v1
kind: Namespace
metadata:
  name: jptcg
---
# Snapshot history lives here — this is the DB.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jptcg-data
  namespace: jptcg
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jptcg
  namespace: jptcg
  labels:
    app: jptcg
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume — old pod must release it before the new one starts
  selector:
    matchLabels:
      app: jptcg
  template:
    metadata:
      labels:
        app: jptcg
    spec:
      automountServiceAccountToken: false
      # Image is private on GHCR; secret created manually:
      # kubectl -n jptcg create secret docker-registry ghcr-pull \
      #   --docker-server=ghcr.io --docker-username=wardbox --docker-password=<PAT with read:packages>
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000 # so the nonroot user can write the PVC
      containers:
        - name: jptcg
          # :latest until the first main build lands; pin a digest after
          image: ghcr.io/wardbox/jptcg:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: jptcg-env
                  key: DISCORD_WEBHOOK
            - name: VIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jptcg-env
                  key: VIEW_TOKEN
            - name: CONTACT
              valueFrom:
                secretKeyRef:
                  name: jptcg-env
                  key: CONTACT
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jptcg-data
---
# Tailnet-only: the Tailscale operator turns this Service into a tailnet
# device named `jptcg` (MagicDNS). No public Ingress on purpose.
apiVersion: v1
kind: Service
metadata:
  name: jptcg
  namespace: jptcg
  annotations:
    tailscale.com/hostname: jptcg
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: jptcg
  ports:
    - name: http
      port: 80
      targetPort: http
