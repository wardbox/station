# jptcg — Pokémon TCG spread scanner (github.com/wardbox/jptcg).
# Image is built and pushed by that repo's Actions; this manifest owns deploy.
# Scan runs in-process every 6h inside the server — no CronJob.
apiVersion: v1
kind: Namespace
metadata:
  name: jptcg
---
# TLS secrets are namespace-scoped, so jptcg needs its own copy of the
# wildcard cert (same ClusterIssuer as cert-manager/wildcard-certificate.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stationsystems-dev-wildcard
  namespace: jptcg
spec:
  secretName: stationsystems-dev-wildcard-tls
  issuerRef:
    name: letsencrypt-dns01-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - "*.stationsystems.dev"
---
# Snapshot history lives here — this is the DB.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jptcg-data
  namespace: jptcg
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jptcg
  namespace: jptcg
  labels:
    app: jptcg
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume — old pod must release it before the new one starts
  selector:
    matchLabels:
      app: jptcg
  template:
    metadata:
      labels:
        app: jptcg
    spec:
      automountServiceAccountToken: false
      # Image is private on GHCR; secret created manually:
      # kubectl -n jptcg create secret docker-registry ghcr-pull \
      #   --docker-server=ghcr.io --docker-username=wardbox --docker-password=<PAT with read:packages>
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000 # so the nonroot user can write the PVC
      containers:
        - name: jptcg
          # :latest until the first main build lands; pin a digest after
          image: ghcr.io/wardbox/jptcg:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: jptcg-env
                  key: DISCORD_WEBHOOK
            - name: VIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jptcg-env
                  key: VIEW_TOKEN
            - name: CONTACT
              valueFrom:
                secretKeyRef:
                  name: jptcg-env
                  key: CONTACT
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jptcg-data
---
apiVersion: v1
kind: Service
metadata:
  name: jptcg
  namespace: jptcg
spec:
  selector:
    app: jptcg
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jptcg
  namespace: jptcg
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jptcg.stationsystems.dev
      secretName: stationsystems-dev-wildcard-tls
  rules:
    - host: jptcg.stationsystems.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jptcg
                port:
                  number: 80
